name: Manual WhatsApp Build Notification

on:
  workflow_dispatch:
    inputs:
      build_status:
        description: 'Build Status (success / failed)'
        required: true
        default: 'success'
        type: choice
        options:
          - success
          - failed
          - in-progress

jobs:
  notify_whatsapp:
    runs-on: ubuntu-latest

    steps:
      - name: Send WhatsApp Notification via BaseKey API
        run: |
          curl -X POST https://basekey.in/api/v1/trigger \
            -H "Authorization: Bearer ${{ secrets.BASEKEY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "template": "apk_build_status",
              "phone": "${{ secrets.WHATSAPP_PHONE_NUMBER }}",
              "variables": [
                "${{ github.repository }}", 
                "${{ github.ref_name }}", 
                "${{ inputs.build_status }}"
              ]
            }'
